<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Redirecting to binpord.com</title>
  <link rel="canonical" href="https://binpord.com/">
  <script>
    // Map old Jekyll post URLs to new Hugo URLs
    var defined_names = [ // extracts from post filenames
      "git", "linear_layer_backprop", "softmax_backprop",
      "normalizing_flows", "positional_encoding", "diffusion_models",
      "ai_coding_benchmarks"
    ];
    var defined_dates = [ // corresponding dates
      "2021-08-13", "2021-09-21", "2021-09-26",
      "2021-11-10", "2022-02-03", "2022-03-17",
      "2026-01-17"
    ];
    var path = window.location.pathname;
    // Old Jekyll URLs: /YYYY/MM/DD/slug.html
    var match = path.match(/^\/(\d{4})\/(\d{2})\/(\d{2})\/(.+?)(?:\.html)?$/);
    if (match) {
      var slug = match[4];
      var idx = defined_names.indexOf(slug);
      if (idx !== -1) {
        window.location.replace("https://binpord.com/posts/" + defined_dates[idx] + "-" + slug + "/");
      } else {
        window.location.replace("https://binpord.com/");
      }
    } else {
      window.location.replace("https://binpord.com/");
    }
  </script>
  <meta http-equiv="refresh" content="0; url=https://binpord.com/">
</head>
<body>
  <p>This blog has moved to <a href="https://binpord.com/">binpord.com</a>.</p>
</body>
</html>
